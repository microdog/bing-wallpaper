name: Shell Validation

on:
  push:
  pull_request:

jobs:
  shell-validation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Run bash syntax checks
        run: |
          bash -n bing-wallpaper.sh \
            Tools/bing-random-pic.sh \
            Tools/gnome-bing-slideshow/deploy-gnome-settings.sh \
            tests/test_bing_wallpaper.sh \
            tests/test_helpers.sh

      - name: Run shellcheck
        run: |
          # tests/test_bing_wallpaper.sh stays in bash -n and regression coverage.
          # It is intentionally excluded from shellcheck in this workflow because
          # this task only changes workflow/docs, not the test file itself.
          shellcheck bing-wallpaper.sh \
            Tools/bing-random-pic.sh \
            Tools/gnome-bing-slideshow/deploy-gnome-settings.sh \
            tests/test_helpers.sh

      - name: Run regression tests
        run: |
          bash tests/test_bing_wallpaper.sh
          bash tests/test_helpers.sh
